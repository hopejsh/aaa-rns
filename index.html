     · 모든 파서·문서 생성기·차트가 자체 구현이므로 CDN 이 필요 없다.
     · connect-src 'self' — 저장형 XSS 가 있어도 데이터를 외부로 유출할 수 없다.
     · LLM 엔진(Claude·Gemini·OpenAI) 엔드포인트 3곳만 예외로 허용한다 — 그 외 외부 연결은 전부 차단. -->
