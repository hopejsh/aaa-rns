version: 2
updates:
  # 이 저장소에는 런타임 의존성이 없다. 감시 대상은 GitHub Actions 뿐이며,
  # 그것들이 유일하게 외부에서 들어와 실행되는 코드다. 해시로 고정해 두었으므로
  # 자동 갱신은 일어나지 않고, Dependabot 이 새 해시를 PR 로 제안하면 사람이 본다.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "build"
    labels:
      - dependencies
