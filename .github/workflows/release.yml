name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# 액션은 태그가 아니라 커밋 해시로 고정한다. @v2 같은 태그는 그 저장소의
# 소유자가 언제든 다른 커밋으로 옮길 수 있고, 여기서는 contents:write 권한으로
# 실행되므로 옮겨진 코드가 릴리스 자산을 바꿔치기할 수 있다. 기록의 무결성을
# 파는 제품이 배포 경로에서 움직이는 참조를 신뢰하는 것은 앞뒤가 맞지 않는다.
# 주석의 태그는 사람이 읽기 위한 것이고, 갱신은 Dependabot 이 PR 로 제안한다.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Build the distribution archive
        run: bash tools/make_dist.sh

      # make_dist.sh already runs verify-dist.sh and deletes the archive on
      # failure. Running it again here proves the published asset — the exact
      # bytes being uploaded — passed, rather than trusting the build step.
      - name: Verify the archive that will actually be published
        run: bash tools/verify-dist.sh dist/*.zip

      - name: Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
      # 발표자료 편집 원본(.pptx)은 저장소가 추적하지 않으므로 여기서 첨부하지
      # 않는다. 덱이 바뀌는 일은 드물고, 바뀌면 릴리스 화면에서 직접 올린다.
      # v2.0.0 자산으로 이미 보존되어 있다.
