name: Feature request
description: Suggest a capability or a change
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is currently hard or impossible? Describe the situation, not the solution.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including "do nothing" — why is that not enough?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: "I have read the honest-limits section of the README and this is not a request for LIMS, instrument integration, or regulated-environment validation."
